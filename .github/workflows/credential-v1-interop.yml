name: Canonical HTTPS credential v1 byte-for-byte interoperability

on:
  push:
    branches: [review/issuer-unified-https-receiver-20261029]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/host-identify
          ref: 4a176373ff4cb47a66a8ab1b5fd3d6ff01ff2a3b
          path: dependencies/host-identify
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/station-access
          ref: 51295bd7a458a621ccbf33eab03da43ba84ce71a
          path: dependencies/station-access
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '${{ matrix.python-version }}'
      - name: Verify exact immutable source/vector/producer bytes
        run: |
          test "$(git -C dependencies/host-identify rev-parse HEAD)" = "4a176373ff4cb47a66a8ab1b5fd3d6ff01ff2a3b"
          test "$(git -C dependencies/station-access rev-parse HEAD)" = "51295bd7a458a621ccbf33eab03da43ba84ce71a"
          cmp tests/fixtures/credential-delivery-v1-vector.json dependencies/station-access/tests/host_registry/fixtures/credential-delivery-v1-vector.json
          grep -F 'PATH = "/.well-known/zog/credential-delivery/v1"' dependencies/station-access/src/zog/station_access/credential_https_interop.py
          grep -F 'PATH = "/.well-known/zog/credential-delivery/v1"' src/zog/root_control/issuer_https_receiver.py
      - name: Install pinned canonical protocol and test prerequisites
        run: |
          python -m pip install ./dependencies/host-identify 'pytest>=8,<10'
      - name: Execute untouched upstream public producer interoperability tests
        env:
          PYTHONPATH: dependencies/station-access/src:src
        run: |
          python -m pytest -q dependencies/station-access/verification/credential_v1/test_shared_interop.py
          python -m pytest -q dependencies/host-identify/tests/test_credential_delivery.py
