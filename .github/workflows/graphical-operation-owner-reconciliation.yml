name: Selected graphical operation owner signed-approval source review
on:
  push:
    branches: [review/graphical-operation-owner-reconciled-20261103]
  pull_request:
    paths:
      - src/zog/root_control/graphical_operation_owner_source.py
      - tests/test_graphical_operation_owner_reconciliation.py
      - .github/workflows/graphical-operation-owner-reconciliation.yml
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=8,<10' 'cryptography>=43,<47'
      - run: PYTHONPATH=src python -m pytest -q tests/test_graphical_operation_owner_source.py tests/test_graphical_operation_owner_reconciliation.py
      - run: echo 'Source-only selected PR29 owner plus PR28 approval; no native CAS, SSM sender, signer/STATE installation.' >> "$GITHUB_STEP_SUMMARY"
