name: Task C protected graphical owner source IPC reconciliation
on:
  push:
    branches: [regular/task-c-installed-owner-runtime-20261104]
  pull_request:
    paths:
      - src/zog/root_control/graphical_s3_checkpoint.py
      - tests/test_graphical_s3_checkpoint.py
      - src/zog/root_control/graphical_owner_service.py
      - src/zog/root_control/graphical_native_owner.py
      - src/zog/root_control/graphical_owner_checkpoint.py
      - src/zog/root_control/graphical_task_c_owner.py
      - src/zog/root_control/graphical_task_c_runtime.py
      - src/zog/root_control/graphical_task_c_trust_authority.py
      - src/zog/root_control/graphical_task_c_native.py
      - src/zog/root_control/graphical_task_c_origin.py
      - src/zog/root_control/graphical_task_c_service.py
      - tests/test_graphical_task_c_owner.py
      - tests/test_graphical_task_c_runtime.py
      - tests/test_graphical_task_c_trust_authority.py
      - tests/test_graphical_task_c_origin.py
      - tests/test_graphical_task_c_ssm_single_attempt.py
      - docs/graphical-task-c-installed-stream-runtime-handoff-2026-11-04.md
      - .github/workflows/graphical-task-c-source.yml
permissions:
  contents: read
jobs:
  exact-task-c-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/host-deploy
          ref: 0ea6d583fa441527f45dabbbf542731560644a72
          path: companions/host-deploy
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<49' 'boto3>=1.34,<2'
      - name: Validate exact Task C mapping and native owner history
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/companions/host-deploy/src
        run: |
          python -m pytest -q -rs \
            tests/test_graphical_s3_checkpoint.py \
            tests/test_graphical_task_c_owner.py \
            tests/test_graphical_task_c_runtime.py \
            tests/test_graphical_task_c_trust_authority.py \
            tests/test_graphical_task_c_origin.py \
            tests/test_graphical_task_c_ssm_single_attempt.py \
            tests/test_graphical_native_owner.py \
            tests/test_graphical_operation_owner_source.py \
            tests/test_graphical_operation_owner_reconciliation.py
      - if: always()
        run: echo 'Source-only stream runtime. Signed v2 observations, distinct S3/SSM role selection and protected preflight are exercised with fake credentials. Native service activation and real SSM remain blocked.' >> "$GITHUB_STEP_SUMMARY"
