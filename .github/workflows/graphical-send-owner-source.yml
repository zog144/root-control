name: Graphical send owner monotonic protocol (source-only)
on:
  push:
    branches: [review/graphical-monotonic-send-owner-20261103]
  pull_request:
    paths:
      - src/zog/root_control/graphical_send_fence_contract.py
      - tests/test_graphical_send_fence_contract.py
      - .github/workflows/graphical-send-owner-source.yml
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=8,<10' 'cryptography>=43,<47'
      - run: python -m pytest -q -rs tests/test_graphical_send_fence_contract.py
      - run: echo 'Synthetic distinct protected CAS domain only; no actual SSM, root signer, STATE, authority or native backend.' >> "$GITHUB_STEP_SUMMARY"
