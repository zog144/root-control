name: Issuer execution fence source-only verification
on:
  push:
    branches: [regular/issuer-execution-epoch-fence-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  issuer-fence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test source-only issuer epoch and recovery
        run: |
          python -m pip install 'pytest>=8,<10' 'dbus-next==0.2.3'
          PYTHONPATH=src python -m pytest -q -ra \
            tests/test_issuer_execution_fence.py \
            tests/test_issuer_systemd_fence.py
      - name: Declare native hold
        if: always()
        run: |
          echo 'Source-only; protected installed root owner, systemd launch, Host revocation publication and reboot admission remain unverified' >> "$GITHUB_STEP_SUMMARY"
