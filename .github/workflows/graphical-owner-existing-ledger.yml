name: Protected graphical owner existing-ledger source
on:
  push:
    branches: [review/graphical-durable-owner-ipc-20261104]
  pull_request:
    paths:
      - src/zog/root_control/graphical_operation_owner_sqlite.py
      - tests/test_graphical_operation_owner_sqlite.py tests/test_graphical_operation_owner_ipc_admission.py
      - tests/test_graphical_operation_owner_ipc_admission.py
      - .github/workflows/graphical-owner-existing-ledger.yml
permissions:
  contents: read
jobs:
  ledger-source:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<47'
      - name: Source only, non-root, no AWS
        env:
          PYTHONPATH: src
        run: |
          test "$(id -u)" -ne 0
          python -m pytest -q tests/test_graphical_operation_owner_source.py tests/test_graphical_operation_owner_reconciliation.py tests/test_graphical_operation_owner_sqlite.py
