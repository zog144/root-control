name: Independent selected issuer fence security review
on:
  push:
    branches: [review/issuer-execution-stable-lock-recovery-20261102]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  negative-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/box-control
          ref: baca7f815974dbf685950c0c7e78f693dd0a96e2
          path: companion/box-control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/host-install
          ref: 437b4448b7af7de5f4237cdf56fac924c833d279
          path: companion/host-install
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pin exact original reviewed owners
        run: |
          test "$(git -C companion/box-control rev-parse HEAD)" = baca7f815974dbf685950c0c7e78f693dd0a96e2
          test "$(git -C companion/host-install rev-parse HEAD)" = 437b4448b7af7de5f4237cdf56fac924c833d279
      - name: Verify no implicit lock rebootstrap and selected cancellation/reconciliation source
        run: |
          python -m pip install 'pytest>=8,<10' 'dbus-next==0.2.3' 'cryptography>=44,<49'
          PYTHONPATH="$PWD/src:$PWD/companion/box-control/box-control/src:$PWD/companion/host-install/src:$PWD/companion/box-control/box-control/tests" \
            python -m pytest -q -rs tests/test_issuer_execution_fence.py \
              tests/test_issuer_systemd_fence.py \
              tests/test_issuer_execution_reconcile.py \
              tests/test_issuer_exact_combined_security.py \
              -k 'not pending_marker_lost_response_still_denies_real_execution'
      - name: Root-owned exact projection / missing final marker / reboot hold
        run: |
          sudo -E env PYTHONPATH="$PWD/src:$PWD/companion/box-control/box-control/src:$PWD/companion/host-install/src:$PWD/companion/box-control/box-control/tests" \
            "$(command -v python)" -m pytest -q -rs \
              tests/test_issuer_exact_combined_security.py
      - name: Native approval withheld
        if: always()
        run: |
          echo 'Independent source review only; original production root/box/host-install commits retain their pins. Real PID1 stop/cgroup, source/RECORD and reboot acceptance remain Work-only.' >> "$GITHUB_STEP_SUMMARY"
