name: Task C original authority issuer source verification
on:
  push:
    branches: [regular/task-c-original-authority-issuance-20261105, regular/task-c-issuer-independent-review-20261106, regular/task-c-prospective-issuer-capture-integration-20261106]
  pull_request:
    paths:
      - src/zog/root_control/graphical_task_c_issuance.py
      - src/zog/root_control/graphical_task_c_issuance_cli.py
      - src/zog/root_control/graphical_task_c_webhook_capture.py
      - src/zog/root_control/graphical_task_c_capture_app.py
      - examples/github-capture/**
      - tests/test_graphical_task_c_issuance.py
      - tests/test_graphical_task_c_issuance_peer_pin.py
      - tests/test_graphical_task_c_issuance_independent_review.py
      - tests/test_graphical_task_c_webhook_capture.py
      - tests/test_graphical_task_c_capture_app.py
      - tests/test_graphical_task_c_capture_to_issuer_integration.py
      - docs/graphical-task-c-original-authority-issuance-2026-11-05.md
      - .github/workflows/graphical-task-c-issuance.yml
permissions:
  contents: read
jobs:
  independent-issuer:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/host-deploy
          ref: 0ea6d583fa441527f45dabbbf542731560644a72
          path: companions/host-deploy
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<49' 'boto3>=1.34,<2'
      - name: Exact dispatcher source and fresh original issuer compatibility
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests:${{ github.workspace }}/companions/host-deploy/src
        run: |
          test "$(git -C companions/host-deploy rev-parse HEAD)" = 0ea6d583fa441527f45dabbbf542731560644a72
          python -m pytest -q -rs \
            tests/test_graphical_task_c_issuance.py \
            tests/test_graphical_task_c_issuance_peer_pin.py \
            tests/test_graphical_task_c_issuance_independent_review.py \
            tests/test_graphical_task_c_webhook_capture.py \
            tests/test_graphical_task_c_capture_app.py \
            tests/test_graphical_task_c_capture_to_issuer_integration.py \
            tests/test_graphical_task_c_origin.py \
            tests/test_graphical_task_c_owner.py \
            tests/test_graphical_task_c_trust_authority.py
      - if: always()
        run: echo 'Synthetic issuer tests only. No live webhook, operator signing key, original anchor, actual revocation or production authority was issued.' >> "$GITHUB_STEP_SUMMARY"
