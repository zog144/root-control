name: Task C independent read-only authority source admission
on:
  push:
    branches: [regular/task-c-readonly-trust-authority-20261105]
  pull_request:
    paths:
      - src/zog/root_control/graphical_task_c_trust_authority.py
      - tests/test_graphical_task_c_trust_authority.py
      - .github/workflows/graphical-task-c-readonly-trust.yml
permissions:
  contents: read
jobs:
  selected-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/host-deploy
          ref: 76416b9d7ef64aac17b75b6ce06b98244fd487e0
          path: companions/host-deploy
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<49' 'boto3>=1.34,<2'
      - name: Exact reviewed broker source and non-authorizing original selection
        run: |
          test "$(git -C companions/host-deploy rev-parse HEAD)" = 76416b9d7ef64aac17b75b6ce06b98244fd487e0
          PYTHONPATH="${{ github.workspace }}/src:${{ github.workspace }}/companions/host-deploy/src" \
          python -m pytest -q -rs \
            tests/test_graphical_task_c_trust_authority.py \
            tests/test_graphical_task_c_origin.py \
            tests/test_graphical_s3_checkpoint.py
      - if: always()
        run: echo 'Source-only original authority; no genuine signer, independent pin, read-only IAM approval, service or SSM is installed.' >> "$GITHUB_STEP_SUMMARY"
