name: Graphical owner durable native service source admission
on:
  push:
    branches: [regular/graphical-native-owner-source-20261104]
  pull_request:
    paths:
      - src/zog/root_control/graphical_native_owner.py
      - src/zog/root_control/graphical_owner_checkpoint.py
      - src/zog/root_control/graphical_owner_service.py
      - tests/test_graphical_native_owner.py
      - .github/workflows/graphical-native-owner-source.yml
permissions:
  contents: read
jobs:
  synthetic-native-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Source test deps only; no AWS execution or native install
        run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<49'
      - name: Independently persistent ledger, external checkpoint, IPC source
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m pytest -q \
            tests/test_graphical_native_owner.py \
            tests/test_graphical_operation_owner_source.py \
            tests/test_graphical_operation_owner_reconciliation.py
      - if: always()
        run: echo 'Source-only tests. Real mounted independent root volume, external nonrollbackable highwater, pinned installer, PID/cgroup, IAM denial and SSM remain native NO-GO.' >> "$GITHUB_STEP_SUMMARY"
