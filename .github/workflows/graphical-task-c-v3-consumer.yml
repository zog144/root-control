name: Task C v3 installation checkpoint broker/owner integration
on:
  push:
    branches: [regular/task-c-v3-checkpoint-consumer-20261107]
  pull_request:
    paths:
      - src/zog/root_control/graphical_task_c_backend_observation.py
      - src/zog/root_control/graphical_task_c_runtime.py
      - src/zog/root_control/graphical_task_c_native.py
      - src/zog/root_control/graphical_task_c_v3_readonly.py
      - src/zog/root_control/graphical_task_c_trust_authority.py
      - tests/test_graphical_task_c_backend_observation.py
      - tests/test_graphical_task_c_v3_readonly.py
      - tests/test_graphical_task_c_v3_native_broker.py
      - .github/workflows/graphical-task-c-v3-consumer.yml
permissions:
  contents: read
jobs:
  v3-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/host-deploy
          ref: 5a36712b878fb7c43a20b017315a96a02f66b298
          path: companions/host-deploy
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/host-install
          ref: 24376bd784b7efcc1e393188f792c41685e75f79
          path: companions/host-install
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<49' 'boto3>=1.34,<2'
      - name: Verify exact companion and source contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests:${{ github.workspace }}/companions/host-deploy/src:${{ github.workspace }}/companions/host-deploy/tests:${{ github.workspace }}/companions/host-install/src:${{ github.workspace }}/companions/host-install/tests
        run: |
          test "$(git -C companions/host-deploy rev-parse HEAD)" = 5a36712b878fb7c43a20b017315a96a02f66b298
          test "$(git -C companions/host-install rev-parse HEAD)" = 24376bd784b7efcc1e393188f792c41685e75f79
          python -m pytest -q -rs \
            tests/test_graphical_task_c_backend_observation.py \
            tests/test_graphical_task_c_v3_readonly.py \
            tests/test_graphical_task_c_v3_native_broker.py \
            tests/test_graphical_task_c_trust_authority.py \
            tests/test_graphical_installation_storage_authority.py \
            tests/test_graphical_installation_storage_commit.py \
            tests/test_graphical_s3_installation_checkpoint.py \
            companions/host-deploy/tests/test_graphics_owner_trust_daemon.py
      - if: always()
        run: echo 'V3 is a source-only consumer candidate. No S3, IAM, signer, native trust broker or SSM permission has been admitted.' >> "$GITHUB_STEP_SUMMARY"
