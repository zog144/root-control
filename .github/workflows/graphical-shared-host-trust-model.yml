name: Selected shared-host Task C three-owner trust contract
on:
  push:
    branches: [regular/task-c-shared-host-trust-reconcile-20261106]
  pull_request:
    paths:
      - docs/graphical-task-c-shared-host-trust-v1.json
      - docs/graphical-task-c-shared-host-trust-model-2026-11-06.md
      - docs/graphical-task-c-shared-host-capture.md
      - tests/test_graphical_task_c_shared_host_trust_model.py
      - .github/workflows/graphical-shared-host-trust-model.yml
permissions:
  contents: read
jobs:
  three-owner-trust-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/host-install
          ref: 3947212018cd3a017f5051d372142f84a1c50c38
          path: companions/host-install
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/host-deploy
          ref: 5c1b497b4098c4fbfd968a99158e3f58ead777fd
          path: companions/host-deploy
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install only source-test requirements
        run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<49' 'boto3>=1.34,<2'
      - name: Prove three exact immutable trust descriptions agree
        run: |
          test "$(git -C companions/host-install rev-parse HEAD)" = 3947212018cd3a017f5051d372142f84a1c50c38
          test "$(git -C companions/host-deploy rev-parse HEAD)" = 5c1b497b4098c4fbfd968a99158e3f58ead777fd
          cmp docs/graphical-task-c-shared-host-trust-v1.json companions/host-install/docs/graphical-task-c-shared-host-trust-v1.json
          cmp docs/graphical-task-c-shared-host-trust-v1.json companions/host-deploy/docs/graphical-task-c-shared-host-trust-v1.json
      - name: Source tests for shared admin and protected owner/issuer routes
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests:${{ github.workspace }}/companions/host-install/src:${{ github.workspace }}/companions/host-install/tests:${{ github.workspace }}/companions/host-deploy/src:${{ github.workspace }}/companions/host-deploy/tests
        run: |
          python -m pytest -q -rs \
            tests/test_graphical_task_c_shared_host_trust_model.py \
            tests/test_graphical_task_c_capture_app.py \
            tests/test_graphical_task_c_webhook_capture.py \
            companions/host-install/tests/test_graphical_native_owner_install.py \
            companions/host-install/tests/test_graphical_shared_host_trust_reconciliation.py \
            companions/host-deploy/tests/test_graphical_shared_host_trust_reconciliation.py
      - if: always()
        run: echo 'Source agreement only. The Host administrator is explicitly trusted. No genuine issuer, installed IAM or SSM acceptance asserted.' >> "$GITHUB_STEP_SUMMARY"
