name: Public source verification

on:
  push:
    branches: [main, unstable]
  pull_request:
    branches: [main, unstable]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Source and public companions (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/companions/box-control/box-control/src:${{ github.workspace }}/.ci-deps
    steps:
      - name: Checkout root-control
        uses: actions/checkout@v4
      - name: Checkout reviewed public box-control
        uses: actions/checkout@v4
        with:
          repository: zog144/box-control
          ref: 124db5cb30dd23da72f7646f7f254b173e325209
          path: companions/box-control
      - name: Checkout public Zog aggregate for image-build
        uses: actions/checkout@v4
        with:
          repository: zog144/zog
          ref: d47d86b363824c718d9c165124cb55bbed12e0f9
          path: companions/zog
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify pins and public source boundary
        run: |
          test "$(git -C companions/box-control rev-parse HEAD)" = "124db5cb30dd23da72f7646f7f254b173e325209"
          test "$(git -C companions/zog rev-parse HEAD)" = "d47d86b363824c718d9c165124cb55bbed12e0f9"
          test ! -e COPYRIGHT
          test ! -e version-share-handoff.json
          test -f LICENSE
          test -f LICENSES/BSD-3-Clause.txt
          test -f LICENSES/GPL-3.0-only.txt
      - name: Build public aggregate namespace overlay
        run: |
          # The older aggregate ships a regular zog/__init__.py. Importing its
          # src wholesale shadows current namespace component checkouts.
          # Link its separately reviewed support modules without either
          # box-control or root-control, keeping the namespace implicit.
          python - <<'PY'
          import os
          from pathlib import Path
          src=Path("companions/zog/src/zog").resolve()
          dest=Path(os.environ["GITHUB_WORKSPACE"])/".ci-deps"/"zog"
          dest.mkdir(parents=True,exist_ok=True)
          for path in src.iterdir():
              if path.name in {"__init__.py","__pycache__","root_control","box_control"}:
                  continue
              if path.is_dir() or (path.is_file() and path.suffix==".py"):
                  (dest/path.name).symlink_to(path)
          assert not (dest/"__init__.py").exists()
          assert not (dest/"root_control").exists()
          assert not (dest/"box_control").exists()
          assert (dest/"image_build").is_dir()
          PY
      - name: Install test dependencies and root-control
        run: |
          python -m pip install 'dbus-next==0.2.3' 'pytest>=8,<10'
          python -m pip install --no-deps .
      - name: Verify namespace and compile
        run: |
          python -m compileall -q src tests acceptance
          python -c 'import pathlib, zog.root_control as r; assert r.__version__ == "0.1.0"; assert pathlib.Path(r.__file__).resolve().is_relative_to(pathlib.Path.cwd() / "src")'
      - name: Run synthetic and mocked privileged-boundary tests
        run: python -m pytest -q tests

  artifacts:
    name: Wheel and source-distribution audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Verify package and licensing
        run: |
          python - <<'PY'
          import glob, tarfile, zipfile
          whls=glob.glob('dist/*.whl'); srcs=glob.glob('dist/*.tar.gz')
          assert len(whls)==len(srcs)==1
          with zipfile.ZipFile(whls[0]) as z:
              names=set(z.namelist())
              assert 'zog/root_control/__init__.py' in names
              assert 'zog/root_control/daemon.py' in names
              assert 'zog/root_control/native/journal-wait.c' in names
              assert 'zog/__init__.py' not in names
              assert not any(x.startswith('zog/box_control/') for x in names)
              assert any(x.endswith('/LICENSE') for x in names)
              entry=next(x for x in names if x.endswith('.dist-info/entry_points.txt'))
              assert 'root-control = zog.root_control.daemon:main' in z.read(entry).decode()
          with tarfile.open(srcs[0], 'r:gz') as z:
              names=z.getnames()
              prefix=names[0].split('/', 1)[0]
              paths={x[len(prefix)+1:] for x in names if x.startswith(prefix+'/')}
              for p in ('LICENSE','LICENSES/BSD-3-Clause.txt',
                        'LICENSES/GPL-3.0-only.txt','THIRD-PARTY-NOTICES.md',
                        'README.md','tests/test_namespace_migration.py',
                        'src/zog/root_control/native/journal-wait.c'):
                  assert p in paths,p
              assert 'COPYRIGHT' not in paths
              assert 'version-share-handoff.json' not in paths
          PY
