# Include inside the existing HTTPS server; preserve its certificate and routes.
location = /zog/task-c/original {
    client_max_body_size 64k;
    client_body_timeout 10s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_send_timeout 10s;
    proxy_request_buffering on;
    proxy_pass http://unix:/run/zog-github-capture/capture.sock;
    proxy_set_header Host $host;
    access_log off;
}
